# Dependency updates as pull requests, so a stale lockfile is something the
# repository reports rather than something an audit finds months later.
#
# Weekly rather than daily, and grouped rather than one PR per package: the
# point is a review that is small enough to actually read. CI runs on every
# one of these, and this project's checks — typecheck, unit, e2e against a
# real Postgres, and a browser smoke suite — are enough to tell a safe bump
# from a breaking one.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Patch and minor bumps travel together; a major arrives on its own,
      # because that is the one that needs a person to read a changelog.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]

  # The workflow's own actions pin to major tags that still move underneath
  # them; this is what notices when one is deprecated.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /apps/web
    schedule:
      interval: monthly
