name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: postgresql://hakmar:hakmar_ci_only@localhost:5432/hakmar?schema=public
  REDIS_URL: redis://localhost:6379
  JWT_ACCESS_SECRET: ci_only_access_secret
  JWT_ACCESS_EXPIRES_IN: 20m
  JWT_REFRESH_SECRET: ci_only_refresh_secret
  JWT_REFRESH_EXPIRES_IN: 7d
  WEB_ORIGIN: http://localhost:5173
  SEED_ADMIN_USERNAME: superadmin
  SEED_ADMIN_PASSWORD: ChangeMe123!

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hakmar
          POSTGRES_PASSWORD: hakmar_ci_only
          POSTGRES_DB: hakmar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hakmar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: pnpm --filter api exec prisma migrate deploy

      - name: Seed database
        run: pnpm --filter api exec prisma db seed

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test

      - name: E2E tests
        run: pnpm run test:e2e

      - name: Build
        run: pnpm run build
