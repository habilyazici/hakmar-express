name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # 5432 here, unlike docker-compose.yml's 5433: a service container has the
  # runner to itself, so there is nothing to collide with and no reason to move.
  DATABASE_URL: postgresql://hakmar:hakmar_ci_only@localhost:5432/hakmar?schema=public
  REDIS_URL: redis://localhost:6379
  JWT_ACCESS_SECRET: ci_only_access_secret_not_used_anywhere_else_0123456789
  JWT_ACCESS_EXPIRES_IN: 20m
  JWT_REFRESH_EXPIRES_IN: 7d
  WEB_ORIGIN: http://localhost:5174
  # The smoke suite serves the API here, and the web bundle bakes this in at
  # build time — so it has to be set for the build, not just for the run.
  VITE_API_URL: http://localhost:3001/api/v1
  SEED_ADMIN_USERNAME: superadmin
  SEED_ADMIN_PASSWORD: ChangeMe123!
  # The login throttle the e2e suite needs raised is set by the `test:e2e`
  # script itself, so a developer running it locally gets the same treatment
  # CI does rather than six 429s and no explanation.

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hakmar
          POSTGRES_PASSWORD: hakmar_ci_only
          POSTGRES_DB: hakmar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hakmar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      # v6 is the first release that knows about pnpm 11, which is what
      # package.json pins. It also has to run before setup-node, whose
      # pnpm cache needs a pnpm on PATH to ask for the store path.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Nothing here checked what the lockfile actually pulls in. A known
      # vulnerability in a transitive dependency is exactly the kind of thing
      # no test can find and no reviewer reads a lockfile diff carefully
      # enough to catch.
      #
      # `--prod` and `--audit-level high`: this fails a build, so it has to
      # fail on things worth failing on. A moderate advisory in a build-time
      # tool is a thing to schedule, not a thing to stop a merge — those still
      # show in the output, they just do not set the exit code.
      - name: Audit dependencies
        run: pnpm audit --prod --audit-level high

      - name: Apply database migrations
        run: pnpm --filter api exec prisma migrate deploy

      # Catches a schema.prisma edit that was never turned into a migration.
      # Without it, CI stayed green while the committed migrations and the
      # schema drifted apart, and only the deploy would find out.
      - name: Check for schema/migration drift
        run: >-
          pnpm --filter api exec prisma migrate diff
          --from-config-datasource
          --to-schema prisma/schema.prisma
          --exit-code

      - name: Seed database
        run: pnpm --filter api exec prisma db seed

      # `lint` checks without rewriting; `lint:fix` is the local convenience.
      # It used to auto-fix, which in CI meant silently rewriting files and
      # reporting success for problems still present in the committed source.
      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test

      - name: E2E tests
        run: pnpm run test:e2e

      - name: Build
        run: pnpm run build

      # The only step that runs the application. Everything above checks the
      # app without ever loading it, which is how three pages once shipped
      # rendering nothing but the error boundary: the types were right, the
      # build succeeded, and no test mounted them. Playwright starts the
      # built API and the built web app itself and drives a real browser
      # through every page.
      - name: Install Chromium for the smoke suite
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Smoke test
        run: pnpm --filter web test:smoke
        env:
          # The web bundle bakes this in at build time, so the build above
          # has to have been given the same value the API will listen on.
          VITE_API_URL: http://localhost:3001/api/v1

      - name: Upload smoke failure artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failure
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
