packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  '@prisma/engines': true
  bcrypt: true
  esbuild: true
  prisma: true
  unrs-resolver: true

# Patched versions forced onto transitive dependencies that their own parent
# has not bumped yet. CI runs `pnpm audit --prod --audit-level high` and a
# high advisory fails the build, so every entry here is an advisory this
# repository has answered rather than muted — remove one once the parent
# ships a release that no longer needs it.
#
# Both of these arrive under the Prisma CLI, which is a build-time tool: the
# production runtime image does not contain it (migrations run from a
# separate image — see docker-compose.prod.yml). mysql2 in particular is a
# driver this Postgres-only project never loads. Pinning them anyway is
# cheaper than reasoning about reachability every time the advisory is
# re-reported.
#
# pnpm 11 reads overrides from here rather than from package.json.
overrides:
  # GHSA-3f6p-5ww8-9rcr — auth plugin downgrade leaks plaintext credentials.
  mysql2: '>=3.22.0'
  # GHSA-ggr8-5vv4-36mx — stack exhaustion merging recursive object graphs.
  deepmerge-ts: '>=8.0.0'
