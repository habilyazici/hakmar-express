services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hakmar
      POSTGRES_PASSWORD: hakmar_dev_only
      POSTGRES_DB: hakmar
    # 5433 on the host, not 5432. Postgres's own default is a busy port on a
    # developer machine — anything else running one grabs it first, and this
    # project's container then silently fails to start while DATABASE_URL
    # happily connects to whatever else is listening. Inside the compose
    # network the port is still 5432; only the host mapping moved.
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hakmar"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # 6380 on the host, for the same reason postgres is on 5433 — and the
    # failure here is worse. Redis has no authentication and numbered
    # databases rather than named ones, so if another project's instance wins
    # the race for 6379 this app's cache lands in it, alongside whatever else
    # is already there, and nothing anywhere reports a problem.
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
