# The headers a <meta> tag cannot carry, in a file rather than inline.
#
# nginx inherits add_header from an enclosing block only while the inner block
# declares none of its own — one `add_header Cache-Control` inside a location
# silently drops every security header the server block set. Every location
# below that sets any header of its own therefore includes this, and the whole
# set stays in one place instead of being repeated with one of them missing.

# The page's own policy is a <meta> tag built with a hash for each inline
# script (apps/web/vite.config.ts). Browsers ignore frame-ancestors delivered
# that way, so it is added here. Two policies never weaken each other: each is
# enforced on its own, so this is strictly additional.
add_header Content-Security-Policy "frame-ancestors 'none'" always;
# The same statement for browsers predating CSP3.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# None of these are used, and an injected script should not be able to ask.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# HSTS belongs wherever TLS terminates. Uncomment only if that is this server:
# sending it over plain HTTP does nothing, and sending it from behind a proxy
# that is not itself serving HTTPS locks clients out of a host that cannot
# answer them.
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
