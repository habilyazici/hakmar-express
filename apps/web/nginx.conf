# Serves the built app, and proxies the API under the same origin.
#
# Same-origin is the point, not a convenience. The browser makes no
# cross-origin request at all: no CORS preflight, no WEB_ORIGIN to keep in
# step with where the app is actually served, and the refresh cookie's
# SameSite=Strict does its job without the API and the app having to agree on
# two hostnames.

server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Do not advertise the version in the Server header or on error pages.
  server_tokens off;

  # Uploads are not something this API accepts; a small cap costs nothing.
  client_max_body_size 1m;

  # For the locations below that add no header of their own.
  include /etc/nginx/snippets/security-headers.conf;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # The API reads this to tell one client from another for its per-IP rate
    # limits, and only trusts it when TRUST_PROXY names how many proxies sit
    # in front. TRUST_PROXY=1 is exactly this layout.
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # A forecast run over a full history is not a fast request.
    proxy_read_timeout 120s;
  }

  # Hashed filenames: the content behind a given URL can never change, so this
  # is safe to cache for as long as a browser will keep it.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html is the one file whose URL is stable while its content changes,
  # so it must never be cached — otherwise a deploy stays invisible until the
  # browser decides otherwise. `location /` redirects here internally, which
  # re-runs location matching, so this block is what actually serves the app.
  location = /index.html {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
  }

  # A single-page app: every route is served by index.html, and React Router
  # decides what it means. Without this, reloading on /forecast is a 404 from
  # nginx for a file that was never meant to exist.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
